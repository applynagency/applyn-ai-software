[mypy]
python_version = 3.11
ignore_missing_imports = True
warn_unused_ignores = True
warn_redundant_casts = True
warn_unreachable = True
check_untyped_defs = False
disallow_untyped_defs = False
plugins = sqlalchemy.ext.mypy.plugin
exclude = ^app/tests/

[mypy-app.models.*]
disable_error_code = name-defined

[mypy-app.repositories.base]
disable_error_code = attr-defined

[mypy-app.services.*]
disable_error_code = assignment,union-attr,arg-type

[mypy-app.workflows.*]
disable_error_code = assignment,union-attr,arg-type,attr-defined

[mypy-app.tenancy.*]
disable_error_code = arg-type

[mypy-app.core.*]
disable_error_code = assignment,call-arg

[mypy-app.*.markdown]
disable_error_code = assignment,attr-defined,valid-type,misc

[mypy-app.deployment.deployer]
disable_error_code = arg-type

[mypy-app.ai_agents.resolution]
disable_error_code = assignment,attr-defined

[mypy-app.services.ai_agent]
disable_error_code = attr-defined,arg-type

[mypy-app.services.ai_agent_template]
disable_error_code = assignment,attr-defined

[mypy-app.main]
disable_error_code = arg-type
