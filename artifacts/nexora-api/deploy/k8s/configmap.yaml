apiVersion: v1
kind: ConfigMap
metadata:
  name: nexora-config
  namespace: nexora
  labels:
    app.kubernetes.io/part-of: nexora
data:
  # Multi-instance runtime: everything coordinates through Redis so API, worker
  # and scheduler pods can scale horizontally without duplicate execution.
  ENVIRONMENT: "production"
  JOB_QUEUE_ENABLED: "true"          # API enqueues; the worker pods do the work + cron
  CACHE_ENABLED: "true"
  SESSION_STORE_ENABLED: "true"
  JWT_DENYLIST_ENABLED: "true"
  DISTRIBUTED_LOCK_ENABLED: "true"
  RATE_LIMIT_ENABLED: "true"
  METRICS_ENABLED: "true"
  TRACING_ENABLED: "true"
  TRACING_EXPORTER: "otlp"
  OTEL_SERVICE_NAME: "nexora-api"
  # REDIS_URL / DATABASE_URL / TRACING_ENDPOINT injected per-environment.
  LOCAL_DATA_DIR: "/data"
  # Example: "https://app.example.com,https://admin.example.com"
  CORS_ALLOWED_ORIGINS: ""
  DATABASE_POOL_SIZE: "10"
  DATABASE_MAX_OVERFLOW: "20"
