# EXAMPLE ONLY — do not commit real secrets. Create the real Secret out-of-band
# (sealed-secrets / external-secrets / `kubectl create secret`). Keys consumed by
# app/core/config.py.
apiVersion: v1
kind: Secret
metadata:
  name: nexora-secrets
  namespace: nexora
type: Opaque
stringData:
  DATABASE_URL: "postgresql+asyncpg://nexora:CHANGE_ME@nexora-postgres:5432/nexora"
  REDIS_URL: "redis://nexora-redis:6379/0"
  JWT_SECRET_KEY: "CHANGE_ME_32_BYTES_MIN"
  MASTER_ENCRYPTION_KEY: "CHANGE_ME_BASE64_32_BYTES"
  TRACING_ENDPOINT: "http://otel-collector:4318"
  # Backup encryption passphrase (used by scripts/backup/pg_backup.sh)
  BACKUP_GPG_PASSPHRASE: "CHANGE_ME"
