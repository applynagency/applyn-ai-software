apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexora-api
  namespace: nexora
  labels:
    app.kubernetes.io/name: nexora-api
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: nexora
spec:
  replicas: 3
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: nexora-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0      # zero-downtime: never drop below desired during rollout
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nexora-api
        app.kubernetes.io/component: api
        app.kubernetes.io/part-of: nexora
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/nexora-api/metrics"
    spec:
      # Graceful termination: give in-flight requests time to drain. The preStop
      # sleep lets the endpoint be removed from Service rotation before the
      # process receives SIGTERM (avoids 502s during rollout/scale-down).
      terminationGracePeriodSeconds: 60
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: nexora-api
                topologyKey: kubernetes.io/hostname
      containers:
        - name: api
          image: nexora/api:latest
          imagePullPolicy: IfNotPresent
          command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "4"]
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: nexora-config
            - secretRef:
                name: nexora-secrets
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 10"]
          # Startup probe gives slow boots (migrations check, master key) headroom
          # without affecting liveness. Liveness is process-only so DB/Redis blips
          # do not kill healthy pods. Readiness gates traffic on dependencies.
          startupProbe:
            httpGet:
              path: /startupz
              port: 8000
            failureThreshold: 30
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /livez
              port: 8000
            initialDelaySeconds: 0
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8000
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          volumeMounts:
            - name: local-data
              mountPath: /data
      volumes:
        - name: local-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: nexora-api
  namespace: nexora
  labels:
    app.kubernetes.io/name: nexora-api
spec:
  selector:
    app.kubernetes.io/name: nexora-api
  ports:
    - name: http
      port: 80
      targetPort: 8000
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: nexora-api
  namespace: nexora
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: nexora-api
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: nexora-api
  namespace: nexora
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: nexora-api
