# Nightly encrypted PostgreSQL backup as a Kubernetes CronJob (Sprint 61B).
# Runs scripts/backup/pg_backup.sh inside the app image (pg_dump + gpg present).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: nexora-pg-backup
  namespace: nexora
  labels:
    app.kubernetes.io/name: nexora-pg-backup
    app.kubernetes.io/part-of: nexora
spec:
  schedule: "0 2 * * *"          # 02:00 UTC daily
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 7
  failedJobsHistoryLimit: 7
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: backup
              image: nexora/api:latest
              command: ["bash", "scripts/backup/pg_backup.sh"]
              env:
                - name: BACKUP_DIR
                  value: "/backups"
                - name: BACKUP_RETENTION_DAYS
                  value: "14"
              envFrom:
                - secretRef:
                    name: nexora-secrets   # DATABASE_URL + BACKUP_GPG_PASSPHRASE
              volumeMounts:
                - name: backups
                  mountPath: /backups
          volumes:
            - name: backups
              persistentVolumeClaim:
                claimName: nexora-backups
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nexora-backups
  namespace: nexora
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 50Gi
