apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: nexora-pilot-scale
  namespace: nexora-pilot
  labels:
    app: pilot-demo
    nexora.applyn.io/pilot: internal
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments/scale"]
    verbs: ["get", "patch", "update"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list", "watch"]
