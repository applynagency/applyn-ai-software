# Ephemeral internal non-production targets for Sprint 66C validation.
# Usage: docker compose -f docker-compose.yml -f docker-compose.pilot-internal.yml up -d pilot-prometheus pilot-k3s

services:
  pilot-prometheus:
    image: prom/prometheus:v2.54.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-lifecycle
    volumes:
      - ./deploy/pilot-internal/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - default
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/healthy"]
      interval: 5s
      timeout: 3s
      retries: 10

  pilot-k3s:
    image: rancher/k3s:v1.30.4-k3s1
    command: server --tls-san=pilot-k3s --tls-san=localhost --disable=traefik
    privileged: true
    networks:
      - default
    healthcheck:
      test: ["CMD", "kubectl", "get", "nodes"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s

  pilot-gitea:
    image: gitea/gitea:1.22.3
    environment:
      - USER_UID=1000
      - USER_GID=1000
      - GITEA__database__DB_TYPE=sqlite3
      - GITEA__server__DOMAIN=pilot-gitea
      - GITEA__server__ROOT_URL=http://pilot-gitea:3000/
      - GITEA__security__INSTALL_LOCK=true
      - GITEA__service__DISABLE_REGISTRATION=true
    volumes:
      - pilot-gitea-data:/data
    networks:
      - default
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

volumes:
  pilot-gitea-data:

networks:
  default:
    name: nexora-api_default
    external: true
